name: Build executables

# Manual run (Actions tab) or push of a version tag such as v1.0.0
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 on purpose: a binary built on an older glibc runs on more Linux distributions
          - os: ubuntu-22.04
            exe: dist/symd
            asset: symd-linux-x86_64.tar.gz
          - os: windows-latest
            exe: dist/symd.exe
            asset: symd-windows-x86_64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: python build.py

      - name: Smoke test (bundled libraries load)
        shell: bash
        run: ${{ matrix.exe }} --version

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist symd

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp dist/symd.exe "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    # Only for version tags: attaches both executables to a GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            symd-linux-x86_64.tar.gz
            symd-windows-x86_64.exe
